name: Business preview regression checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  synthetic-customer-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact proposed website changes
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify topic dossier evidence boundary parses
        run: node --check tens-topic-evidence-boundary.js
      - name: Test source-backed topic dossier fail-closed behavior
        run: node --test tests/topic-evidence-boundary.test.cjs
      - name: Reject unknown topic links without cross-project fallback
        run: node --test tests/topic-routing-no-cross-project-fallback.test.cjs
      - name: Verify synthetic topic overview source-backed marker
        run: node --test tests/topic-overview-verified-marker.test.cjs
      - name: Test Lyons Bay source links and prevent unsupported findings
        run: node --test tests/hurley-public-source-links.test.cjs
      - name: Test official public-source links across project subjects
        run: node --test tests/public-official-source-links.test.cjs
      - name: Test public Q&A provider-to-guard contract
        run: node --test tests/public-qa-contract.test.cjs
      - name: Test public research CORS preflight boundaries
        run: node --test tests/research-cors-preflight.test.cjs
      - name: Test worker claim adapter contract and queued-timeout honesty
        run: node --test tests/worker-adapter-contract.test.cjs
      - name: Test offline signed-queue mock and fail-closed receipts
        run: node --test tests/offline-signed-queue-review.test.cjs
      - name: Test review-only D1 atomic research queue (SQLite)
        run: node --test tests/d1-research-queue.test.cjs
      - name: Test isolated production-shape migration with synthetic SQLite rows
        run: node --test tests/d1-production-shape-migration.test.cjs
      - name: Test review-only D1 worker candidate wrapper (legacy rollover, tokens, sessions)
        run: node --test tests/worker-d1-candidate.test.cjs
      - name: Test tab-private research and explicit safe public evidence share
        run: node --test tests/research-share-public-url-security.test.cjs
      - name: Test per-tab session header on research POST and status GET
        run: node --test tests/api-config-session-header.test.cjs
      - name: Test review-only source-backed result builder (fail-closed, attestation required)
        run: node --test tests/source-backed-result-builder.test.cjs
      - name: Test review-only D1 acceptance harness (offline, fail-closed)
        run: node --test tests/d1-acceptance-harness.test.cjs
      - name: Test review-only D1 acceptance Worker entrypoint (fail-closed, offline)
        run: node --test tests/d1-acceptance-worker.test.cjs
      - name: Test owner-local D1 acceptance invoker (offline, fail-closed)
        run: node --test tests/d1-acceptance-invoke.test.cjs
      - name: Test owner-local D1 invoker negative cases (offline, no Cloudflare)
        run: node --test tests/d1-acceptance-invoke-ag182-negative.test.cjs
      - name: Verify JavaScript parses
        run: |
          node --check tens-business-capabilities.js
          node --check tens-business-free-assessment.js
          node --check tens-business-work-client.js
      - name: Test free business preview policy
        run: node tests/business-preview-no-false-ready.test.cjs
      - name: Test opt-in preview to quote handoff
        run: node tests/business-preview-quote-handoff.test.cjs
      - name: Test actual business registry in browser mock
        run: node tests/business-preview-real-registry.test.cjs
      - name: Test rejected and missing organization sessions
        run: node tests/business-work-client-authorization.test.cjs
      - name: Exercise mobile browser assessment and quote handoff in Chromium
        run: node tests/business-preview-headless-browser.test.cjs